<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Kulki</title>
    <style>
        body { font-family: sans-serif; text-align: center; }
        #board { display: grid; grid-template-columns: repeat(9, 40px); grid-gap: 2px; margin: 20px auto; width: fit-content; }
        .cell { width: 40px; height: 40px; background: #e0e0e0; border-radius: 4px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        .ball { width: 30px; height: 30px; border-radius: 50%; }
    </style>
</head>
<body>
<h1>Kulki</h1>
<p>Cel gry: ułóż co najmniej pięć kulek tego samego koloru w linii, aby je usunąć.</p>
<div id="board"></div>
<p>Punkty: <span id="score">0</span></p>
<script src="kulki.js"></script>
</body>
</html>
